<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Personal Assistant</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Inter Font for a clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        
        /* Custom scrollbar for the chat window */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Loading dots animation */
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #6b7280;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #6b7280;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #6b7280;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #6b7280; }
            50%, 100% { background-color: #e5e7eb; }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden" style="height: 90vh;">
        
        <!-- Header -->
        <header class="bg-indigo-600 px-6 py-4 flex items-center justify-between border-b border-indigo-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-indigo-600 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-white font-semibold text-lg">Smart Assistant</h1>
                    <p class="text-indigo-200 text-sm">Online and ready to help</p>
                </div>
            </div>
        </header>

        <!-- Chat History -->
        <main id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50 flex flex-col">
            <!-- Initial Greeting Message -->
            <div class="flex w-full mt-2 space-x-3 max-w-xs">
                <div class="flex-shrink-0 h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center">
                    <span class="text-indigo-600 font-bold text-xs">AI</span>
                </div>
                <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm text-gray-800 text-sm border border-gray-100">
                    Hello! I am your Smart Personal Assistant. How can I help you today?
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="bg-white p-4 sm:p-6 border-t border-gray-200">
            <form id="chat-form" class="flex gap-3">
                <input 
                    type="text" 
                    id="chat-input" 
                    class="flex-1 bg-gray-100 text-gray-800 placeholder-gray-500 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow"
                    placeholder="Type a message..."
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    id="send-btn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-3 w-12 h-12 flex items-center justify-center transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const chatWindow = document.getElementById('chat-window');
            const sendBtn = document.getElementById('send-btn');

            // The URL of your Python backend
            const BACKEND_URL = 'http://127.0.0.1:5000/chat';

            /**
             * Appends a message bubble to the chat window
             * @param {string} sender - 'user' or 'assistant'
             * @param {string} text - The message text
             */
            function appendMessage(sender, text) {
                const messageContainer = document.createElement('div');
                messageContainer.className = 'flex w-full mt-2 space-x-3 max-w-md';
                
                // Convert newlines to <br> for proper rendering of lists/traces
                const formattedText = text.replace(/\n/g, '<br>');

                if (sender === 'user') {
                    // User Message Styling (Aligned Right)
                    messageContainer.classList.add('ml-auto', 'justify-end');
                    messageContainer.innerHTML = `
                        <div class="bg-indigo-600 p-3 rounded-l-lg rounded-br-lg shadow-sm text-white text-sm">
                            ${formattedText}
                        </div>
                    `;
                } else {
                    // Assistant Message Styling (Aligned Left)
                    messageContainer.innerHTML = `
                        <div class="flex-shrink-0 h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center mt-auto mb-auto">
                            <span class="text-indigo-600 font-bold text-xs">AI</span>
                        </div>
                        <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm text-gray-800 text-sm border border-gray-100 whitespace-pre-wrap">
                            ${formattedText}
                        </div>
                    `;
                }

                chatWindow.appendChild(messageContainer);
                scrollToBottom();
            }

            /**
             * Adds a temporary typing indicator
             * @returns {HTMLElement} The loading element
             */
            function showLoadingIndicator() {
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'flex w-full mt-2 space-x-3 max-w-xs';
                loadingDiv.id = 'loading-indicator';
                loadingDiv.innerHTML = `
                    <div class="flex-shrink-0 h-8 w-8 rounded-full bg-gray-200 flex items-center justify-center">
                        <span class="text-gray-500 font-bold text-xs">AI</span>
                    </div>
                    <div class="bg-white p-4 rounded-r-lg rounded-bl-lg shadow-sm border border-gray-100 flex items-center">
                        <div class="dot-flashing ml-3"></div>
                    </div>
                `;
                chatWindow.appendChild(loadingDiv);
                scrollToBottom();
                return loadingDiv;
            }

            /**
             * Automatically scrolls the chat window to the newest message
             */
            function scrollToBottom() {
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const messageText = chatInput.value.trim();
                
                if (!messageText) return;

                // 1. Add User Message to UI
                appendMessage('user', messageText);
                chatInput.value = '';
                
                // Disable input while waiting for response
                chatInput.disabled = true;
                sendBtn.disabled = true;
                
                // 2. Show loading dots
                const loadingElement = showLoadingIndicator();

                try {
                    // 3. Make POST request to backend
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: messageText })
                    });

                    // 4. Parse response
                    let replyText = "";
                    const data = await response.text();
                    
                    // Try parsing as JSON in case the backend sends {"response": "..."}
                    try {
                        const jsonData = JSON.parse(data);
                        replyText = jsonData.response || jsonData.message || jsonData.reply || data;
                    } catch (e) {
                        // If it's not JSON, just use the raw string
                        replyText = data;
                    }

                    // Remove loading indicator and append real response
                    loadingElement.remove();
                    appendMessage('assistant', replyText);

                } catch (error) {
                    console.error('Error communicating with backend:', error);
                    loadingElement.remove();
                    appendMessage('assistant', '⚠️ Connection error. Please make sure your Python backend is running on http://127.0.0.1:5000 and has CORS enabled.');
                } finally {
                    // Re-enable input
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    chatInput.focus();
                }
            });
        });
    </script>
</body>
</html>
